name: Bump Newt

on:
  schedule:
    # Weekly Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: bump-newt
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Compare with latest fosrl/newt release
        id: versions
        run: |
          set -euo pipefail
          TAG=$(curl -fsSL https://api.github.com/repos/fosrl/newt/releases/latest | jq -r .tag_name)
          LATEST="${TAG#v}"
          CURRENT=$(sed -n 's/^ARG NEWT_VERSION="\(.*\)".*/\1/p' newt/Dockerfile)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply version bump
        if: steps.versions.outputs.up_to_date == 'false'
        run: |
          set -euo pipefail
          LATEST="${{ steps.versions.outputs.latest }}"
          SHA_AMD64=$(curl -fsSL "https://github.com/fosrl/newt/releases/download/${LATEST}/newt_linux_amd64" | sha256sum | cut -d' ' -f1)
          SHA_ARM64=$(curl -fsSL "https://github.com/fosrl/newt/releases/download/${LATEST}/newt_linux_arm64" | sha256sum | cut -d' ' -f1)

          sed -i 's/ARG NEWT_VERSION="[^"]*"/ARG NEWT_VERSION="'"$LATEST"'"/' newt/Dockerfile
          sed -i 's/ARG NEWT_SHA256_AMD64="[^"]*"/ARG NEWT_SHA256_AMD64="'"$SHA_AMD64"'"/' newt/Dockerfile
          sed -i 's/ARG NEWT_SHA256_ARM64="[^"]*"/ARG NEWT_SHA256_ARM64="'"$SHA_ARM64"'"/' newt/Dockerfile
          sed -i 's/^version: "[^"]*"/version: "'"$LATEST"'-1"/' newt/config.yaml

      - name: Create pull request
        if: steps.versions.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Bump Newt to ${{ steps.versions.outputs.latest }}"
          title: "Bump Newt to ${{ steps.versions.outputs.latest }}"
          body: |
            Automated bump to match [fosrl/newt](https://github.com/fosrl/newt) `${{ steps.versions.outputs.latest }}`.

            Updates `NEWT_VERSION` and pinned `NEWT_SHA256_*` checksums in `newt/Dockerfile`.

            Before merging a release, add an entry for `${{ steps.versions.outputs.latest }}-1` in `newt/CHANGELOG.md`.
          branch: bump-newt-${{ steps.versions.outputs.latest }}
          delete-branch: true
